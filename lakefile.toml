name = "Project"
defaultTargets = ["Project"]

[leanOptions]
autoImplicit = false

# Mathlib at a fixed commit. Its own lake-manifest.json pins its dependencies,
# and this project's lake-manifest.json records them.
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "048fffa1dbcd080d3058fab41d8c188168595c22"

[[lean_lib]]
name = "Project"
# Build every module under `Project/`. There is no root file that imports them
# all, so pull requests that add files never conflict over one.
globs = ["Project.+"]
